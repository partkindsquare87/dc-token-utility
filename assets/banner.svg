<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="55%" stop-color="#12101f"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b5c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff3b5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8f9bff"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9ccff"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1830"/>
      <stop offset="100%" stop-color="#100e1e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="260" fill="url(#glow1)"/>
  <circle cx="1080" cy="300" r="220" fill="url(#glow2)"/>

  <!-- faint grid -->
  <g stroke="#3a3560" stroke-width="1" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- binary rain -->
  <g fill="#5865F2" opacity="0.35" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
    <text x="850" y="40">01001</text>
    <text x="905" y="70">110010</text>
    <text x="960" y="45">01</text>
    <text x="1010" y="90">1101</text>
    <text x="1060" y="55">0011</text>
    <text x="870" y="130">1010110</text>
    <text x="1000" y="150">0101</text>
    <text x="930" y="180">1100</text>
    <text x="1070" y="200">0110101</text>
    <text x="880" y="220">01011</text>
    <text x="1020" y="250">10011</text>
    <text x="950" y="280">01100</text>
  </g>

  <!-- Terminal window on right -->
  <g>
    <rect x="820" y="70" width="300" height="180" rx="10" fill="url(#termGrad)" stroke="#5865F2" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="840" cy="88" r="5" fill="#ff5f56"/>
    <circle cx="858" cy="88" r="5" fill="#ffbd2e"/>
    <circle cx="876" cy="88" r="5" fill="#27c93f"/>
    <line x1="835" y1="105" x2="1100" y2="105" stroke="#3a3560" stroke-width="1"/>
    <text x="840" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8f9bff">$ run grabber.exe</text>
    <text x="840" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#7dffb3">[+] scanning tokens...</text>
    <text x="840" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#7dffb3">[+] found 1 token</text>
    <text x="840" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ff6b81">[!] token extracted</text>
    <text x="840" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9ccff">MTk4NTk...*****</text>
  </g>

  <!-- key/token icon -->
  <g transform="translate(1080,120)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#keyGrad)" stroke-width="7"/>
    <rect x="-6" y="18" width="12" height="42" fill="url(#keyGrad)"/>
    <rect x="-6" y="42" width="24" height="8" fill="url(#keyGrad)"/>
    <rect x="-6" y="54" width="18" height="8" fill="url(#keyGrad)"/>
  </g>

  <!-- Headline & tagline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="70" fill="url(#headGrad)" textLength="760" lengthAdjust="spacingAndGlyphs">Token Grabber</text>
  <text x="60" y="228" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="70" fill="url(#headGrad)" textLength="360" lengthAdjust="spacingAndGlyphs">Discord</text>

  <text x="60" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#c9ccff" opacity="0.9" textLength="740" lengthAdjust="spacingAndGlyphs">Automates Discord token extraction — no more manual digging, just run and go</text>

  <!-- accent line -->
  <rect x="60" y="292" width="140" height="4" rx="2" fill="#5865F2"/>
  <rect x="210" y="292" width="40" height="4" rx="2" fill="#ff3b5c" opacity="0.8"/>
</svg>